<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <script src="./script.js" defer></script> 
        <title>Weather</title>

        <!--імпорт картинок з сайту fonts.google.com -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" />

    </head>
    <body>

        <main class="mainContainer">

            <header class="inputContainer">
                <input type="text" class="inputCity" placeholder="Введіть назву міста..">
                <button class="searchButton">
                    <span class="material-symbols-outlined">
                        search
                    </span>
                </button>
            </header>

            <section class="weatherInfo" style="display: none;">
                <div class="localDateContainer">
                    <div class="location">

                        <span class="material-symbols-outlined">
                            pin_drop
                        </span>

                        <h4 class="countryTxt">Київ</h4>

                    </div>
                    <h5 class="currentDateTxt regularTxt">Вт, 5 листопада</h5>
                </div>

                <div class="weatherSummaryContainer">
                    <img src="assests/weather/windy.png" class="weatherSummaryImg">
                    <div class="weatherSummaryInfo">
                        <h1 class="tempTxt">1 ℃</h1>
                        <h3 class="conditionTxt regularTxt">Вітряно</h3>
                    </div>
                </div>

                <div class="weatherConditionContainer">
                    <div class="conditionItem">
                        <span class="material-symbols-outlined">
                            humidity_low
                        </span>

                        <div class="conditionInfo">
                            <h5 class="regularTxt">Вологість:</h5>
                            <h5 class="humidityValueTxt">80%</h5>
                        </div>

                        <div class="conditionItem">

                            <span class="material-symbols-outlined">
                                wind_power
                            </span>
    
                            <div class="conditionInfo">
                                <h5 class="regularTxt">Швидкість вітру:</h5>
                                <h5 class="windValueTxt">11 км/год</h5>
                            </div>
                        </div>
                    </div>


                <div class="forecastItemContainer">
                    <div class="forecastItem">
                        <h5 class="forecastItemDate regularTxt">06</h5>
                    <img src="assests/weather/partlySunny.png" class="forecastItemImg">
                    <h5 class="forecastItemTemp">1 ℃</h5>
                    </div>
                </div>

                
                <div class="forecastItemContainer">
                    <div class="forecastItem">
                        <h5 class="forecastItemDate regularTxt">06</h5>
                    <img src="assests/weather/partlySunny.png" class="forecastItemImg">
                    <h5 class="forecastItemTemp">1 ℃</h5>
                    </div>
                </div>

                
                <div class="forecastItemContainer">
                    <div class="forecastItem">
                        <h5 class="forecastItemDate regularTxt">06</h5>
                    <img src="assests/weather/partlySunny.png" class="forecastItemImg">
                    <h5 class="forecastItemTemp">1 ℃</h5>
                    </div>
                </div>
            </section>

            <section class="searchCity sectionMessage">
                <div>
                    <img src="assests/map.png" class="messageImg">
                    <h1>Пошук міста</h1>
                    <h4 class="regularTxt">Пошук за містом погоди та температури (англійською)</h4>
                </div>
            </section>

            <section class="notFound sectionMessage" style="display: none;">
                <div>
                    <h1>Помилка</h1>
                    <h4 class="regularTxt">Місто не знайдено :(</h4>
                </div>
            </section>
        </main>
    </body>
</html>
